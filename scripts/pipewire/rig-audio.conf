# Container-only PipeWire fragment: a virtual playback rig for audio tests.
#
# Loaded by the container entrypoint into
# /root/.config/pipewire/pipewire.conf.d/ (see scripts/container-entrypoint.sh).
#
#   rig-sink : null sink, becomes the default playback target. Its monitor
#                 (output) ports are what capture clients record.
#
# Capture does not need its own node: ALSA clients capture the sink's monitor
# because the entrypoint exports
#
#   PIPEWIRE_NODE=rig-sink
#   PIPEWIRE_ALSA="stream.capture.sink = true"
#
# for every alsa-pipewire client in the container (PipeWire 0.3.x policy-node
# routes a capture stream at a sink to its monitor ports when the stream has
# stream.capture.sink; without it the capture stream would pick the default
# source, which does not exist in a container). play into rig-sink, record
# from rig-sink: a deterministic round trip with no host hardware.

context.objects = [
    {   factory = adapter
        args = {
            factory.name           = support.null-audio-sink
            node.name              = "rig-sink"
            node.description       = "Rig Test Sink"
            media.class            = "Audio/Sink"
            audio.position         = "FL,FR"
            audio.rate             = 48000
            monitor.channel-volumes = true
        }
    }
]
